[api]
name = "magma"
major_version = 0
minor_version = 6
patch_version = 7

[copyright]
spdx = "MIT"
holder = "The Magma GPU Project"
year = 2026

# Locations relative to the required '--out-dir' parameter where generated code
# will be placed
[out-dir-info.client]
ffi = "ffi/autogenerated.rs"
header = "temp/ffi/include/magma.h"
protocol = "protocol.rs"
encoder = "encoder.rs"

[out-dir-info.server]
protocol = "protocol.rs"
encoder = "decoder.rs"

[ffi]
crate_name = "magma_gpu_magma"
custom_imports = [
    "use magma_gpu_magma::magma_enumerate_devices as enumerate_devices;",
]
exclude_imports = [
    "MagmaStatus",
    "MagmaVendorId",
]
status_types = [
    "MagmaStatus",
]

[encoder]
protocol_import = "use crate::protocol::*;"
custom_imports = [
    "use magma_gpu::util::Writer;",
]

[decoder]
protocol_import = "use crate::protocol::*;"
custom_imports = [
    "use magma_gpu::util::Reader;",
]
